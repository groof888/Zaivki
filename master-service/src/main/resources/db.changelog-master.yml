databaseChangeLog:
        - changeSet:
                  id: 20260403-1
                  author: groof888
                  changes:
                          - createTable:
                                    tableName: users
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGINT
                                                      autoIncrement: true
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: external_id
                                                      type: BIGINT
                                                      constraints:
                                                              unique: true
                                                              nullable: false
                                            - column:
                                                      name: name
                                                      type: VARCHAR(255)

        - changeSet:
                  id: 20260403-2
                  author: groof888
                  changes:
                          - createTable:
                                    tableName: masters
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGINT
                                                      autoIncrement: true
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: name
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: specialization
                                                      type: VARCHAR(255)
                                            - column:
                                                      name: status
                                                      type: VARCHAR(50)
                                            - column:
                                                      name: user_id
                                                      type: BIGINT
                                                      constraints:
                                                              unique: true
                                                              nullable: false
                                                              foreignKeyName: fk_master_user
                                                              referencedTableName: users
                                                              referencedColumnNames: id

        - changeSet:
                  id: 20260407-3-final-v3
                  author: groof888
                  changes:
                          - createTable:
                                    tableName: emergency_events
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGINT
                                                      autoIncrement: true
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: worker_id
                                                      type: BIGINT
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: worker_last_name
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: payout_amount
                                                      type: DECIMAL(19,2)
                                                      defaultValueNumeric: 50000.00
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: event_date
                                                      type: TIMESTAMP
                                                      defaultValueComputed: now()
                                                      constraints:
                                                              nullable: false

        - changeSet:
                  id: 20260407-4-final-v3
                  author: groof888
                  changes:
                          - createTable:
                                    tableName: master_tasks
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGINT
                                                      autoIncrement: true
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: task_name
                                                      type: VARCHAR(255)
                                            - column:
                                                      name: description
                                                      type: VARCHAR(1000)
                                            - column:
                                                      name: status
                                                      type: VARCHAR(50)
                                            - column:
                                                      name: ticket_id
                                                      type: BIGINT
                                            - column:
                                                      name: master_id
                                                      type: BIGINT
                                                      constraints:
                                                              foreignKeyName: fk_task_master
                                                              referencedTableName: masters
                                                              referencedColumnNames: id