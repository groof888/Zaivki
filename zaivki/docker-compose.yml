services:
  # База данных для request-service
  postgres_db:
    image: postgres:15-alpine
    container_name: request_postgres
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
  master_postgres:
    image: postgres:15-alpine
    container_name: master_postgres
    environment:
      POSTGRES_DB: master_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6380:6379" # Внешний порт 6380 (для Spring), внутренний 6379 (стандарт Redis)

  # Инфраструктура Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1